<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易隨機抽籤器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎯 隨機抽籤器</h1>
        
        <p>請在下方輸入名單（每行一個名字）：</p>
        <textarea id="nameInput" placeholder="例如：&#10;小明&#10;小華&#10;小美"></textarea>
        
        <button onclick="drawWinner()">開始抽籤</button>

        <div id="resultContainer" class="hidden">
            <h2>中獎的是...</h2>
            <p id="winnerName"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
